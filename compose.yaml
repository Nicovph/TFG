# Docker Compose file for the Traductor_TEA project.
# Defines PostgreSQL, Django, and React services for local development.

name: traductor-tea

services:
  db:
    image: postgres:16-bookworm
    # Restart policy: restart the container automatically unless it was
    # explicitly stopped by the user. This supports resiliency during
    # transient failures and host reboots while preserving intentional stops.
    restart: unless-stopped
    # PostgreSQL writes operational output to stdout/stderr. Docker's rotating
    # local driver preserves recent diagnostics without allowing unbounded log
    # growth on the host (at most three files of about 10 MB before compression).
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

    # PostgreSQL container environment variables.
    # The admin password is read from a Docker secret file rather than stored here.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password

    # Mount secrets into the container for database initialization and runtime use.
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password

      - source: db_app_config
        target: db_app_config

      - source: db_migrate_config
        target: db_migrate_config

      - source: db_test_config
        target: db_test_config

    volumes:
      # Persistent PostgreSQL storage volume.
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts so PostgreSQL can run them on first startup.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Mount SQL files used by the init script for database setup.
      - ./docker/postgres/sql:/opt/traductor-tea/sql:ro

    healthcheck:
      # The healthcheck verifies PostgreSQL is ready to accept connections.
      # It uses the pg_isready utility inside the container and checks the
      # configured database and user.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      # Check every 5 seconds to quickly detect service readiness/failure.
      interval: 5s
      # Give each command up to 3 seconds to complete before marking it failed.
      timeout: 3s
      # Require 10 consecutive failures before the container is considered unhealthy.
      retries: 10
      # Allow PostgreSQL up to 10 seconds to start before health checks begin.
      start_period: 10s
    # Keep PostgreSQL unexposed at the host boundary. Containerized Django and
    # migration tasks resolve it by service name on the internal backend-db
    # network; host-side database access is deliberately unavailable.
    networks:
      - backend-db

  backend:
    build:
      context: . # The context is the root of the project. In this way Dockerfile can copy files from the root of the project.
      dockerfile: docker/django/Dockerfile
    init: true # Docker executes a little init process inside the container to manage correctly signals and child processes.
    restart: unless-stopped
    # Bound operational stdout/stderr retention and rotate logs automatically.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DB_PROFILE: app
      DJANGO_DB_APP_CREDENTIALS_FILE: /run/secrets/db_app_config
      # The integrated Compose stack has an explicit React origin, so require its
      # post-callback URL instead of relying on Django's standalone same-origin fallback.
      FRONTEND_AUTH_RETURN_URL: ${FRONTEND_AUTH_RETURN_URL:?Set FRONTEND_AUTH_RETURN_URL in .env}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:?Set GOOGLE_OIDC_CLIENT_ID in .env}
      GOOGLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/google_oidc_client_secret
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:?Set GOOGLE_OIDC_REDIRECT_URI in .env}
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      INTERPRETATION_HMAC_KEY_FILE: /run/secrets/interpretation_hmac_key
      GROQ_MODEL: ${GROQ_MODEL:-}
      # Fail before serving HTTP if either required backend-only secret is absent.
      LLM_PROVIDER_REQUIRED: "true"
      # Empty optional values delegate defaults and validation to Django,
      # avoiding a second, drift-prone configuration source in Compose.
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-}
      LLM_MAX_VISUAL_CONCEPTS: ${LLM_MAX_VISUAL_CONCEPTS:-}
      LLM_MAX_VISUAL_CONCEPT_CHARACTERS: ${LLM_MAX_VISUAL_CONCEPT_CHARACTERS:-}
      ARASAAC_CONNECT_TIMEOUT_SECONDS: ${ARASAAC_CONNECT_TIMEOUT_SECONDS:-}
      ARASAAC_READ_TIMEOUT_SECONDS: ${ARASAAC_READ_TIMEOUT_SECONDS:-}
      ARASAAC_TOTAL_TIMEOUT_SECONDS: ${ARASAAC_TOTAL_TIMEOUT_SECONDS:-}
      ARASAAC_CACHE_TTL_SECONDS: ${ARASAAC_CACHE_TTL_SECONDS:-}
      ARASAAC_NOT_FOUND_CACHE_TTL_SECONDS: ${ARASAAC_NOT_FOUND_CACHE_TTL_SECONDS:-}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-}
      LLM_RETRY_BASE_MILLISECONDS: ${LLM_RETRY_BASE_MILLISECONDS:-}
      LLM_MAX_RETRY_DELAY_SECONDS: ${LLM_MAX_RETRY_DELAY_SECONDS:-}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-}
      LLM_MAX_CONCURRENT_PROVIDER_CALLS_PER_PROCESS: ${LLM_MAX_CONCURRENT_PROVIDER_CALLS_PER_PROCESS:-}
      LLM_DUPLICATE_CACHE_ALIAS: ${LLM_DUPLICATE_CACHE_ALIAS:-}
      LLM_REQUIRE_SHARED_DUPLICATE_CACHE: ${LLM_REQUIRE_SHARED_DUPLICATE_CACHE:-}
      LLM_DUPLICATE_TTL_SECONDS: ${LLM_DUPLICATE_TTL_SECONDS:-}
      LLM_INTERPRETATION_ATTEMPTS_PER_MINUTE: ${LLM_INTERPRETATION_ATTEMPTS_PER_MINUTE:-}
      LLM_INTERPRETATION_ATTEMPTS_PER_DAY: ${LLM_INTERPRETATION_ATTEMPTS_PER_DAY:-}
      LLM_RATE_LIMIT_STATE_RETENTION_DAYS: ${LLM_RATE_LIMIT_STATE_RETENTION_DAYS:-}
      LLM_USER_REQUESTS_PER_MINUTE: ${LLM_USER_REQUESTS_PER_MINUTE:-}
      LLM_USER_REQUESTS_PER_DAY: ${LLM_USER_REQUESTS_PER_DAY:-}
      LLM_USER_TOKENS_PER_MINUTE: ${LLM_USER_TOKENS_PER_MINUTE:-}
      LLM_USER_TOKENS_PER_DAY: ${LLM_USER_TOKENS_PER_DAY:-}
      LLM_GLOBAL_REQUESTS_PER_MINUTE: ${LLM_GLOBAL_REQUESTS_PER_MINUTE:-}
      LLM_GLOBAL_REQUESTS_PER_DAY: ${LLM_GLOBAL_REQUESTS_PER_DAY:-}
      LLM_GLOBAL_TOKENS_PER_MINUTE: ${LLM_GLOBAL_TOKENS_PER_MINUTE:-}
      LLM_GLOBAL_TOKENS_PER_DAY: ${LLM_GLOBAL_TOKENS_PER_DAY:-}
      POSTGRES_DB: traductor_tea_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "60"
      POSTGRES_CONNECT_TIMEOUT: "5" # Maximum time that Django takes to try to connect to PostgreSQL.
      POSTGRES_SSLMODE: disable
    secrets:
      - source: db_app_config
        target: db_app_config

      - source: google_oidc_client_secret
        target: google_oidc_client_secret

      - source: groq_api_key
        target: groq_api_key

      - source: interpretation_hmac_key
        target: interpretation_hmac_key
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: # Checks periodically if Django is working.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
        ]
      # Executes the comprobation each 10 seconds.
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s # Give Django an initial 20 seconds of leeway before it starts penalizing healthcheck failures.
    # The image already runs as the unprivileged appuser. Prevent setuid/setgid
    # binaries or file capabilities from granting additional privileges later.
    security_opt:
      - no-new-privileges:true
    # Django only needs ordinary files, TCP sockets, and port 8000; it requires
    # no Linux capabilities, so remove the complete capability bounding set.
    cap_drop:
      - ALL
    networks:
      frontend-backend:
        # Select the non-internal network as Django's default gateway so calls
        # to Google, Groq, and ARASAAC do not depend on network attachment order.
        gw_priority: 1
      backend-db:

  frontend:
    build:
      context: .
      dockerfile: docker/react/Dockerfile
    init: true
    restart: unless-stopped
    # Bound operational stdout/stderr retention and rotate logs automatically.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Resolve Django through Compose DNS while preserving the browser-visible
      # Host header in Vite's proxy for Django origin and CSRF validation.
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        [
          "CMD",
          # Executes the provided JavaScript code as a single-line argument.
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/', { signal: AbortSignal.timeout(3000) }).then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Prevent privilege escalation via setuid/setgid binaries and file capabilities.
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability (the individual privileges that control what
    # "root" can actually do, such as binding low ports, changing ownership, etc.)
    # so the container starts with zero special privileges
    cap_drop:
      - ALL
    networks:
      - frontend-backend

  backend-migrate:
    # This prevents the service from starting in a normal docker compose up.
    profiles:
      - migrate
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    init: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate"]
    environment:
      DJANGO_DB_PROFILE: migrate
      DJANGO_DB_MIGRATE_CREDENTIALS_FILE: /run/secrets/db_migrate_config
      POSTGRES_DB: traductor_tea_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      POSTGRES_CONNECT_TIMEOUT: "5"
      POSTGRES_SSLMODE: disable
    secrets:
      - source: db_migrate_config
        target: db_migrate_config
    # Migrations need PostgreSQL DDL privileges, not operating-system privilege
    # escalation or Linux capabilities; apply the same container hardening.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-db

  backend-test:
    # Tests are an explicit one-off task and must not start during the normal
    # application lifecycle.
    profiles:
      - test
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    init: true
    # It will never restart automatically if it stops or fails.
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "test"]
    environment:
      # Keep Django's database-profile validation and use the dedicated role
      # that is allowed to create and destroy temporary test databases.
      DJANGO_DB_PROFILE: test
      DJANGO_DB_TEST_CREDENTIALS_FILE: /run/secrets/db_test_config
      # The ordinary suite mocks external providers and must not require or
      # receive their production credentials.
      LLM_PROVIDER_REQUIRED: "false"
      POSTGRES_DB: traductor_tea_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      POSTGRES_CONNECT_TIMEOUT: "5"
      POSTGRES_SSLMODE: disable
    secrets:
      # Grant the test task only its PostgreSQL credentials. In particular, it
      # receives no Google, Groq, application, or migration secrets.
      - source: db_test_config
        target: db_test_config
    # Match the backend hardening: the test runner needs neither privilege
    # escalation nor Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The internal-only network provides PostgreSQL access but no normal route
    # to external services, so accidental real provider calls fail closed.
    networks:
      - backend-db

secrets:
  postgres_admin_password:
    file: ./.secrets/db-admin-password.txt

  db_app_config:
    file: ./.secrets/db-app.env

  db_migrate_config:
    file: ./.secrets/db-migrate.env

  db_test_config:
    file: ./.secrets/db-test.env

  google_oidc_client_secret:
    file: ./.secrets/google-oidc-client-secret.txt

  groq_api_key:
    file: ./.secrets/groq-api-key.txt

  interpretation_hmac_key:
    file: ./.secrets/interpretation-hmac-key.txt

volumes:
  postgres_data:

# Define the shared networks used by services; each service explicitly joins only the networks it requires.
networks:
  # React can reach Django, and Django uses this non-internal network for the
  # external HTTPS services required by authentication and interpretation.
  frontend-backend:
  # Keep database traffic on an externally isolated network. PostgreSQL, Django,
  # and the migration task retain mutual communication on this network, while
  # PostgreSQL and migrations receive no normal direct route to the Internet.
  backend-db:
    internal: true
