# Docker Compose file for the Traductor_TEA project.
# Defines PostgreSQL and Django services for local development.

name: traductor-tea

services:
  db:
    image: postgres:16-bookworm
    # Restart policy: restart the container automatically unless it was
    # explicitly stopped by the user. This supports resiliency during
    # transient failures and host reboots while preserving intentional stops.
    restart: unless-stopped

    # PostgreSQL container environment variables.
    # The admin password is read from a Docker secret file rather than stored here.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password

    # Mount secrets into the container for database initialization and runtime use.
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password

      - source: db_app_config
        target: db_app_config

      - source: db_migrate_config
        target: db_migrate_config

      - source: db_test_config
        target: db_test_config

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      # Persistent PostgreSQL storage volume.
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts so PostgreSQL can run them on first startup.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Mount SQL files used by the init script for database setup.
      - ./docker/postgres/sql:/opt/traductor-tea/sql:ro

    healthcheck:
      # The healthcheck verifies PostgreSQL is ready to accept connections.
      # It uses the pg_isready utility inside the container and checks the
      # configured database and user.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      # Check every 5 seconds to quickly detect service readiness/failure.
      interval: 5s
      # Give each command up to 3 seconds to complete before marking it failed.
      timeout: 3s
      # Require 10 consecutive failures before the container is considered unhealthy.
      retries: 10
      # Allow PostgreSQL up to 10 seconds to start before health checks begin.
      start_period: 10s

  backend:
    build:
      context: . # The context is the root of the project. In this way Dockerfilecan copy files from the root of the project.
      dockerfile: docker/django/Dockerfile
    init: true # Docker executs a little init process inside the container to manage correctly signals and child processes.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DB_PROFILE: app
      DJANGO_DB_APP_CREDENTIALS_FILE: /run/secrets/db_app_config
      # Throws a clear error if not set in .env, preventing silent misconfiguration.
      FRONTEND_AUTH_RETURN_URL: ${FRONTEND_AUTH_RETURN_URL:?Set FRONTEND_AUTH_RETURN_URL in .env}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:?Set GOOGLE_OIDC_CLIENT_ID in .env}
      GOOGLE_OIDC_CLIENT_SECRET_FILE: /run/secrets/google_oidc_client_secret
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:?Set GOOGLE_OIDC_REDIRECT_URI in .env}
      POSTGRES_DB: traductor_tea_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "60"
      POSTGRES_CONNECT_TIMEOUT: "5" # Maximum time that Django takes to try to connect to PostgreSQL.
      POSTGRES_SSLMODE: disable
    secrets:
      - source: db_app_config
        target: db_app_config

      - source: google_oidc_client_secret
        target: google_oidc_client_secret
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck: # Checks periodically if Django is working.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"
        ]
      # Executes the comprobation each 10 seconds.
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s # Give Django an initial 20 seconds of leeway before it starts penalizing healthcheck failures.

  backend-migrate:
    # This prevents the service from starting in a normal docker compose up.
    profiles:
      - migrate
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    init: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "migrate"]
    environment:
      DJANGO_DB_PROFILE: migrate
      DJANGO_DB_MIGRATE_CREDENTIALS_FILE: /run/secrets/db_migrate_config
      POSTGRES_DB: traductor_tea_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      POSTGRES_CONNECT_TIMEOUT: "5"
      POSTGRES_SSLMODE: disable
    secrets:
      - source: db_migrate_config
        target: db_migrate_config

secrets:
  postgres_admin_password:
    file: ./.secrets/db-admin-password.txt

  db_app_config:
    file: ./.secrets/db-app.env

  db_migrate_config:
    file: ./.secrets/db-migrate.env

  db_test_config:
    file: ./.secrets/db-test.env

  google_oidc_client_secret:
    file: ./.secrets/google-oidc-client-secret.txt

volumes:
  postgres_data:
